<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tr3tol repo</title>
<style>
:root {
	--bg: #f5f5f7;
	--card: #ffffff;
	--text: #1c1c1e;
	--muted: #6e6e73;
	--line: #e3e3e6;
	--accent: #1c1c1e;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #000000;
		--card: #1c1c1e;
		--text: #f5f5f7;
		--muted: #98989d;
		--line: #2c2c2e;
		--accent: #f5f5f7;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 3rem 1.25rem 4rem;
	background: var(--bg);
	color: var(--text);
	font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	-webkit-font-smoothing: antialiased;
}
main { max-width: 34rem; margin: 0 auto; }
header { text-align: center; margin-bottom: 2.5rem; }
header img { width: 96px; height: 96px; border-radius: 22px; display: block; margin: 0 auto 1rem; }
h1 { font-size: 1.75rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
header p { color: var(--muted); margin: 0; }
.add {
	display: block;
	text-align: center;
	background: var(--accent);
	color: var(--bg);
	text-decoration: none;
	font-weight: 600;
	padding: .9rem 1rem;
	border-radius: 12px;
	margin-bottom: .75rem;
}
.url {
	display: block;
	text-align: center;
	font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
	font-size: .875rem;
	color: var(--muted);
	word-break: break-all;
	margin-bottom: 2.5rem;
}
.pkg {
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 14px;
	padding: 1.1rem 1.25rem;
	display: flex;
	gap: 1rem;
	align-items: center;
	text-decoration: none;
	color: inherit;
}
.pkg img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
.pkg h2 { font-size: 1.05rem; margin: 0 0 .15rem; }
.pkg p { margin: 0; color: var(--muted); font-size: .9rem; }
.downloads { margin-top: .3rem !important; font-size: .8rem !important; opacity: .75; }
footer { margin-top: 3rem; text-align: center; color: var(--muted); font-size: .85rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
	<header>
		<img src="CydiaIcon.png?v=2" alt="">
		<h1>tr3tol repo</h1>
		<p>Tweaks for rootless jailbreaks</p>
	</header>

	<a class="add" href="sileo://source/https://tr3tol.github.io/repo/">Add to Sileo</a>
	<span class="url">https://tr3tol.github.io/repo/</span>

	<a class="pkg" href="depictions/flexclock.html">
		<img src="assets/icon.png?v=2" alt="">
		<div>
			<h2>FlexClock</h2>
			<p>Image based lock screen clock with installable digit packs</p>
			<p class="downloads" id="downloads" hidden></p>
		</div>
	</a>

	<footer>
		<a href="https://github.com/tr3tol">github.com/tr3tol</a>
	</footer>
</main>
<script>
fetch("https://api.github.com/repos/tr3tol/FlexClock/releases")
	.then(function (response) { return response.ok ? response.json() : Promise.reject(); })
	.then(function (releases) {
		var total = releases.reduce(function (sum, release) {
			return sum + release.assets.reduce(function (n, asset) {
				return n + asset.download_count;
			}, 0);
		}, 0);
		if (!total) return;
		var element = document.getElementById("downloads");
		element.textContent = total.toLocaleString() + " release download" + (total === 1 ? "" : "s");
		element.hidden = false;
	})
	.catch(function () { /* rate limited or offline: leave the line hidden */ });
</script>
</body>
</html>
